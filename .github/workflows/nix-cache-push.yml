name: Nix cache push

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NIX_CACHE_URL: https://nix.systemfsoftware.com
  NIX_CACHE_PUBLIC_KEY: nix-cache-1:wXA8I4DayNW9q6enUyQA/P/nT38pGSTLt374t3gsn7M=

jobs:
  push:
    name: push · ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    environment: nix-cache-push
    timeout-minutes: 60
    steps:
      - id: start
        name: Record the job start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: The R2 push values are set
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          NIX_CACHE_R2_ENDPOINT: ${{ secrets.NIX_CACHE_R2_ENDPOINT }}
        run: |
          set -euo pipefail
          missing=0
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY NIX_CACHE_R2_ENDPOINT; do
            if [ -z "${!name}" ]; then
              echo "::error title=nix-cache-push::${name} is not set in the nix-cache-push environment, so nothing was built or pushed"
              missing=1
            fi
          done
          exit "$missing"
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.NIX_CACHE_URL }}
            extra-trusted-public-keys = ${{ env.NIX_CACHE_PUBLIC_KEY }}

      - name: The signing key is the cache's key
        env:
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          : "${NIX_CACHE_SIGNING_KEY:?NIX_CACHE_SIGNING_KEY is not set}"
          umask 077
          printf '%s' "$NIX_CACHE_SIGNING_KEY" > "$RUNNER_TEMP/signing-key"
          derived=$(nix --extra-experimental-features nix-command key convert-secret-to-public < "$RUNNER_TEMP/signing-key")
          if [ "$derived" != "$NIX_CACHE_PUBLIC_KEY" ]; then
            echo "::error title=nix-cache-key::NIX_CACHE_SIGNING_KEY does not derive the cache's public key; nothing was pushed"
            exit 1
          fi

      - name: Build the push set
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          flake="github:${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          # The push set is workspace-tarballs plus every member it lists; no attribute is named by hand.
          mapfile -t members < <(nix eval --json "${flake}#packages.${SYSTEM}.workspace-tarballs.members" --apply 'ms: map (m: m.attr) ms' | jq -r '.[]')
          if [ "${#members[@]}" -eq 0 ]; then
            echo "::error title=nix-cache-push::workspace-tarballs lists no members, so there is nothing to push"
            exit 1
          fi
          attrs=(workspace-tarballs pnpm-store producer-tarballs "${members[@]}")
          {
            echo "The push set (${SYSTEM}):"
            printf -- '- %s\n' "${attrs[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
          : > "$RUNNER_TEMP/out-paths"
          : > "$RUNNER_TEMP/build-failures"
          for attr in "${attrs[@]}"; do
            if out=$(nix build --no-link --print-out-paths -L "${flake}#packages.${SYSTEM}.${attr}"); then
              printf '%s\n' "$out" >> "$RUNNER_TEMP/out-paths"
            else
              echo "$attr" >> "$RUNNER_TEMP/build-failures"
              echo "::error title=nix-build-failed::${attr} did not build"
            fi
          done

      - name: Push the closures
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          NIX_CACHE_R2_ENDPOINT: ${{ secrets.NIX_CACHE_R2_ENDPOINT }}
        run: |
          set -euo pipefail
          echo "::add-mask::${NIX_CACHE_R2_ENDPOINT#https://}"
          mapfile -t outs < "$RUNNER_TEMP/out-paths"
          if [ "${#outs[@]}" -eq 0 ]; then
            echo "::error title=nix-cache-push::nothing built, so nothing was pushed"
            exit 1
          fi
          failed=0
          if ! nix copy --to "s3://systemfsoftware-nix-cache?endpoint=${NIX_CACHE_R2_ENDPOINT#https://}&region=auto&scheme=https&compression=zstd&multipart-upload=true&secret-key=${RUNNER_TEMP}/signing-key" "${outs[@]}" 2> "$RUNNER_TEMP/copy.err"; then
            failed=1
            reason=$(sed -n '/error: ./{s/^[[:space:]]*//;p;q}' "$RUNNER_TEMP/copy.err" | cut -c1-300)
            echo "::error title=nix-cache-push::the push failed: ${reason:-nix copy failed}"
            echo "The push failed: ${reason:-nix copy failed}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s "$RUNNER_TEMP/build-failures" ]; then
            failed=1
            {
              echo "These did not build, so they were not pushed:"
              sed 's/^/- /' "$RUNNER_TEMP/build-failures"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$failed"

      - name: Every pushed path is served signed
        run: |
          set -euo pipefail
          mapfile -t outs < "$RUNNER_TEMP/out-paths"
          missing=0
          for path in "${outs[@]}"; do
            name="${path#/nix/store/}"
            hash="${name%%-*}"
            status=$(curl --silent --show-error --output "$RUNNER_TEMP/narinfo" --write-out '%{http_code}' "${NIX_CACHE_URL}/${hash}.narinfo" || true)
            if [ "$status" != "200" ]; then
              echo "::error title=nix-cache-narinfo::${path} is not in the cache: ${NIX_CACHE_URL}/${hash}.narinfo returned HTTP ${status}"
              echo "- ${path}: HTTP ${status}" >> "$RUNNER_TEMP/narinfo-failures"
              missing=1
            elif ! grep -q '^Sig: nix-cache-1:' "$RUNNER_TEMP/narinfo"; then
              echo "::error title=nix-cache-narinfo::${path} is in the cache without a nix-cache-1 signature: ${NIX_CACHE_URL}/${hash}.narinfo"
              echo "- ${path}: no nix-cache-1 signature" >> "$RUNNER_TEMP/narinfo-failures"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            {
              echo "These pushed paths are not served signed by ${NIX_CACHE_URL}:"
              cat "$RUNNER_TEMP/narinfo-failures"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$missing"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing-key" "$RUNNER_TEMP/copy.err"

      - name: Record the job's wall time
        if: always()
        env:
          START: ${{ steps.start.outputs.at }}
          SYSTEM: ${{ matrix.system }}
        run: |
          echo "nix cache push wall time (${SYSTEM}): $(( $(date +%s) - START ))s" >> "$GITHUB_STEP_SUMMARY"
