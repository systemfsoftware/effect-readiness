# Mergify: the policy lives in systemfsoftware/.github (.mergify.yml). This file names this repository's CI checks.
extends: .github

queue_rules:
  - name: default
    # Checked on the pull request itself before it enters the queue.
    queue_conditions:
      - check-success = checks / gate
      - or:
          - check-success = lint PR commits
          - check-skipped = lint PR commits
      - or:
          - check-success = changeset · shared tooling / a publishable-package change needs an intent
          - check-skipped = changeset · shared tooling / a publishable-package change needs an intent
    # Checked on Mergify's queue draft (mergify/merge-queue/*): the pull request rebased on main with its batch.
    merge_conditions:
      - check-success = checks / gate
